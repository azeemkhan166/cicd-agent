spring:
  autoconfigure:
    exclude:
      - org.springframework.cloud.gcp.autoconfigure.sql.GcpCloudSqlAutoConfiguration
      - org.springframework.cloud.gcp.autoconfigure.core.GcpContextAutoConfiguration
  datasource:
    url: jdbc:h2:mem:payroll_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

